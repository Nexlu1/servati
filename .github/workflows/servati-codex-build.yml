name: SERVATI Codex build

on:
  push:
    branches:
      - codex-quartz-site-20260908
    paths:
      - "codex/**"
      - ".github/workflows/servati-codex-build.yml"
      - "SERVATI_V11_AUTHORITATIVE_MANUSCRIPT.md"
      - "drafts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout SERVATI
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch V12 draft source branch
        run: |
          git fetch origin v12-faiths-choirs-custody-wars-20260907:refs/remotes/origin/v12-faiths-choirs-custody-wars-20260907

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone pinned Quartz v5
        run: |
          git clone --filter=blob:none https://github.com/jackyzha0/quartz.git quartz-work
          git -C quartz-work checkout --detach f1fba3fc55cbf60a60a5d09c95a49c042cdab63a
          test "$(git -C quartz-work rev-parse HEAD)" = "f1fba3fc55cbf60a60a5d09c95a49c042cdab63a"

      - name: Install Quartz dependencies
        working-directory: quartz-work
        run: npm ci

      - name: Apply SERVATI Codex configuration
        run: |
          cp codex/quartz.config.yaml quartz-work/quartz.config.yaml
          cp codex/custom.scss quartz-work/quartz/styles/custom.scss
          cp codex/codex-random-modes.js quartz-work/quartz/static/codex-random-modes.js

      - name: Generate SERVATI Codex pages
        run: |
          rm -rf quartz-work/content
          python codex/build_servati_content.py --repo . --out quartz-work/content
          cat quartz-work/content/SERVATI_GENERATION_RESULT.json

      - name: Acquire exact GitHub-pinned Quartz plugins
        run: |
          python codex/manage_quartz_plugins.py acquire \
            --manifest codex/SERVATI_CODEX_BUILD_MANIFEST.json \
            --config codex/quartz.config.yaml \
            --source-root quartz-work/plugin-sources \
            --result quartz-work/SERVATI_PLUGIN_ACQUISITION_RESULT.json

      - name: Install exact GitHub-pinned Quartz plugins
        working-directory: quartz-work
        run: |
          set -o pipefail
          npm_config_package_lock=false npx quartz plugin install --from-config --concurrency 1 2>&1 | tee plugin-install.log
          if grep -Eq "[1-9][0-9]* failed|Failed to" plugin-install.log; then
            echo "Quartz reported one or more plugin installation failures" >&2
            exit 1
          fi
          python ../codex/manage_quartz_plugins.py verify \
            --manifest ../codex/SERVATI_CODEX_BUILD_MANIFEST.json \
            --config quartz.config.yaml \
            --source-root plugin-sources \
            --installed-root .quartz/plugins \
            --result SERVATI_PLUGIN_VERIFICATION_RESULT.json

      - name: Build SERVATI Codex
        working-directory: quartz-work
        run: |
          set -o pipefail
          npx quartz build --concurrency 2 2>&1 | tee codex-build.log
          if grep -Eq "Failed to install plugin|Failed to load manifest|Could not determine category|Could not load plugin|has no factory function|factory did not return|missing the required methods|Failed to instantiate plugin" codex-build.log; then
            echo "Quartz skipped or failed one or more configured plugins" >&2
            exit 1
          fi

      - name: Sanity-check built Codex
        run: |
          python codex/verify_servati_site.py \
            --repo . \
            --content quartz-work/content \
            --output quartz-work/public \
            --plugin-result quartz-work/SERVATI_PLUGIN_VERIFICATION_RESULT.json \
            --result quartz-work/SERVATI_CODEX_BUILD_RESULT.json

      - name: Upload built codex
        uses: actions/upload-artifact@v4
        with:
          name: servati-codex-site
          path: quartz-work/public
          if-no-files-found: error
          retention-days: 14

# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "SERVATI CODEX"
  pageTitleSuffix: " — The Worlds That Held the Dead"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: nexlu1.github.io/servati
  ignorePatterns: [private, templates, .obsidian]
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Georgia
      body: Segoe UI
      code: Consolas
    colors:
      lightMode:
        light: "#111417"
        lightgray: "#242a2f"
        gray: "#697178"
        darkgray: "#d7d2c9"
        dark: "#f0e9dd"
        secondary: "#c6a15b"
        tertiary: "#72aebb"
        highlight: "rgba(198,161,91,0.14)"
        textHighlight: "#8a6c2f88"
      darkMode:
        light: "#0b0d0f"
        lightgray: "#20262b"
        gray: "#626b72"
        darkgray: "#ded8ce"
        dark: "#f2eadc"
        secondary: "#c6a15b"
        tertiary: "#72aebb"
        highlight: "rgba(198,161,91,0.14)"
        textHighlight: "#8a6c2f88"

plugins:
  - source: "./plugin-sources/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority: [frontmatter, git, filesystem]
    order: 10
  - source: "./plugin-sources/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: false
      enableVideoEmbed: false
      enableCheckbox: true
    order: 20
  - source: "./plugin-sources/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "./plugin-sources/table-of-contents"
    enabled: true
    order: 40
    layout: {position: right, priority: 20}
  - source: "./plugin-sources/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
    order: 50
  - source: "./plugin-sources/description"
    enabled: true
    order: 60
  - source: "./plugin-sources/content-index"
    enabled: true
    options: {enableSiteMap: true, enableRSS: false}
  - source: "./plugin-sources/content-page"
    enabled: true
  - source: "./plugin-sources/folder-page"
    enabled: true
    options: {showFolderCount: true, showSubfolders: true, prefixFolders: false}
  - source: "./plugin-sources/tag-page"
    enabled: true
    options: {prefixTags: true}
  - source: "./plugin-sources/bases-page"
    enabled: true
    options: {}
  - source: "./plugin-sources/page-title"
    enabled: true
    layout: {position: left, priority: 10}
  - source: "./plugin-sources/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions: {grow: true}
  - source: "./plugin-sources/darkmode"
    enabled: true
    layout: {position: left, priority: 30, group: toolbar}
  - source: "./plugin-sources/reader-mode"
    enabled: true
    layout: {position: left, priority: 35, group: toolbar}
  - source: "./plugin-sources/quartz_randomPage"
    enabled: true
    options:
      excludeTags: [navigation]
      excludePathPrefixes: [tags]
    layout: {position: left, priority: 40}
  - source: "./plugin-sources/explorer"
    enabled: true
    options:
      title: Archive Registers
      folderDefaultState: collapsed
      folderClickBehavior: link
      useSavedState: true
    layout: {position: left, priority: 50}
  - source: "./plugin-sources/breadcrumbs"
    enabled: true
    layout: {position: beforeBody, priority: 5, condition: not-index}
  - source: "./plugin-sources/article-title"
    enabled: true
    layout: {position: beforeBody, priority: 10}
  - source: "./plugin-sources/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: [status, type, register, era, part, inheritance_logic, source_file, source_branch, source_commit, source_lines]
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 5
    layout: {position: right, priority: 10, display: all}
  - source: "./plugin-sources/content-meta"
    enabled: true
    options: {showReadingTime: true, showComma: false}
    layout: {position: beforeBody, priority: 20}
  - source: "./plugin-sources/tag-list"
    enabled: true
    layout: {position: afterBody, priority: 5}
  - source: "./plugin-sources/backlinks"
    enabled: true
    layout: {position: right, priority: 40}
  - source: "./plugin-sources/recent-notes"
    enabled: false
    options:
      title: Recent Source Records
      limit: 3
      showTags: false
      hideTagPages: true
      hideFolderPages: true
      linkToMore: special/recent-changes
  - source: "./plugin-sources/graph"
    enabled: false
    layout: {position: right, priority: 70}
  - source: "./plugin-sources/footer"
    enabled: true
    options:
      links:
        Source Repository: https://github.com/Nexlu1/servati
        V11 Manuscript: https://github.com/Nexlu1/servati/blob/main/SERVATI_V11_AUTHORITATIVE_MANUSCRIPT.md
    layout: {position: footer, priority: 50}

layout:
  groups:
    toolbar: {priority: 35, direction: row, gap: 0.5rem}
  byPageType:
    "404": {positions: {beforeBody: [], left: [], right: []}}
    content: {}
    folder: {}
    tag: {}
    bases: {}
